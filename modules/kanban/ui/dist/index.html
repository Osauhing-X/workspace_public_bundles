<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; frame-src about:; connect-src 'none'; form-action 'none'; base-uri 'none'"><style>/* Corporate Visual Identity */

:root{
  --x_brand: #da3;
  --x_color: var(--color_override, var(--x_brand));
  
  --x_body_background: #eee;
  --x_header_background: #222;
  --x_aside_background: #111;


  /* LIGHT */
  --x_light_1: #fff; /* section, h1-h3, b */
  --x_light_2: #ccc; /* div, p, i, li, td */
  --x_light_3: #999; /* span, small */

  /* DARK */
  --x_dark_1: #000; /* section, h1-h3, b */
  --x_dark_2: #333; /* div, p, i, li, td */
  --x_dark_3: #777; /* span, small */
}


/* --- */


html {
  background-color: var(--x_body_background);
  scrollbar-color: #000 transparent;
  scrollbar-width: none;
  scroll-behavior: smooth; }


body {
  position: relative;
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;}



center.css {
  width: min(100% - var(--center_space_override, 2em), var(--center_max_override, 1000px));
  box-sizing: border-box;
  margin-inline: auto; 
  &._800{
    --center_max_override: 800px; }
  &._full {
    --center_space_override: 0; }
  &._left {
    text-align: left !important;} }
  


:is(section, aside).css {
  &._radius {
    border-radius: 5px;}
  &._padding {
    padding: 1em; }
  &._padding_2 {
    padding: 2em 10px;} }


:is(div, ul).css {
  &._radius {
    border-radius: 5px;}
  &._padding {
    padding: 10px; } }


/* --- # Popover */

html:has(:popover-open){
  -webkit-tap-highlight-color: transparent;
  &:has([popover="auto"]){
    cursor: url("https://extaas.com/ui_resources/close.png") 2 2, pointer; }
  body {
    background-image: url("https://extaas.com/ui_resources/bg/noise.png") !important;
    background-size: unset !important;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
    touch-action: none;
    filter: grayscale(1) opacity(0.3) blur(1em);
    overflow: hidden; } }
    [popover]:popover-open {
      border: 0 solid;
      overflow: hidden auto;
      scrollbar-width: none;
      scrollbar-color: transparent transparent;
      max-height: 100dvh;
      cursor: auto;
      pointer-events: all;
      box-sizing: border-box;
      background: transparent;
      padding: 0;
      position: fixed;
    @media (min-width: 601px) { /* Desktop */
      width: min(calc(100% - 1em), var(--w, 500px)) }
    @media (max-width: 600px) { /* Mobile */
      width: calc(100% - 1em) }
      &::backdrop {
        background: linear-gradient(16deg, #00faff42, #ff00d630) } }
        


/* --- # Build */


.grid {
  display: grid;
  grid-auto-rows: min-content;
  &._start {
    justify-items: start; }
  @media (min-width: 800px){
    &._fr-max {
      grid-template-columns: 1fr max-content; }
    &._max-fr {
      grid-template-columns: max-content 1fr; } } }


:is(.flex, .grid)._center {
  &:not(._x, ._y) {
    align-content: center;
    align-items: center;
    justify-content: center; }
  &._x {
    justify-content: center; }
  &._y {
    align-content: center;
    align-items: center; }}


.flex { display: flex;
  &._wrap { flex-wrap: wrap;}
  &._reverse {flex-direction: row-reverse;}
  &._right { justify-content: flex-end; }
  &._down { flex-direction: column; }
  &._space {justify-content: space-between;}
  &._bottom {align-items: flex-end;} }


.gap {
  &:not(._2, ._3, ._5, ._10) {gap: 5px;}
  &._2 {gap: 10px;}
  &._3 {gap: 15px;}
  &._5 {gap: 25px;}
  &._10 {gap: 50px;} }


/* --- # Helper */


[id] { scroll-margin-top: 55px; }

.auto_hide { content-visibility: auto }

.full_width {width: -webkit-fill-available !important;}

.full_text { white-space: nowrap; }

.hide, [type=hidden] { display: none !important }

.dark { color-scheme: dark; }

.light {  color-scheme: light;}

.reset { all: unset; }

@media (max-width: 800px){ .computer { display: none;} }


/* --- # Other */

hr:not(.unset) {
  border-bottom: 0;
  border-left: 0;
  &._transparent {
    border-color: transparent; }
  &._x {
    width: -webkit-fill-available; }
  &._y {
    height: -webkit-fill-available; } }


/* --- # Custom */


.blur, [blur] {
  position: relative !important;
  cursor: wait;
  user-select: none;
  pointer-events: none;
  &:not([blur=""])::after {
    position: absolute;
    content: attr(blur);
    width: 90%;
    text-align: center;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'modern_sans';
    font-size: var(--blur_text_size, xx-large);
    text-shadow: 0 0 10px var(--reverse); }
  > * {
     animation: blur_bg 2s linear infinite;
     pointer-events: none;} }
@keyframes blur_bg {
  from, to {filter: blur(8px) opacity(.2);}
  50% {filter: blur(5px) opacity(.5);} }



@property --color_override {
  syntax: "<color>";
  inherits: true;
  initial-value: orange; }

html.rainbow {
  /* A stepped transition avoids recalculating the entire inherited style
     tree on every animation frame. */
  animation: rainbow 8s steps(24, end) infinite; }

@media (prefers-reduced-motion: reduce) {
  html.rainbow { animation: none; }
}

@keyframes rainbow {
  0%   { --color_override: #ddaa33; }
  20%  { --color_override: #45fe57; }
  40%  { --color_override: #00fffb; }
  60%  { --color_override: #6eadff; }
  80%  { --color_override: #ff6ecf; }
  100% { --color_override: #ddaa33; }
}

/* Shared package-frame defaults. Layout and controls remain owned by the CVI.
   Opaque frames cannot inherit the Core document's typography or surface. */
:root {
  --color_override: var(--x_brand, #da3);
  --override-background: #f6f7f9;
  --override-section: var(--x_light_1, #fff);
  --override-box: #f9fafb;
  --override-border: #d9dee7;
  --override-text: #344054;
  --override-muted: #667085;
}
html { background: var(--override-background); font-family: ui-sans-serif, system-ui, sans-serif; color: var(--override-text); }
/* CVI body is flex: prevent the frame root shrinking below its content height. */
#module { flex: 0 0 auto; width: 100%; display: flow-root; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
/* The supplied CVI has layout utilities but no shared controls or panels. */
button, .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 7px 12px; border: 1px solid var(--override-border); border-radius: 6px; background: var(--x_light_1, #fff); color: var(--x_dark_2, #333); font-size: .875rem; font-weight: 600; text-decoration: none; }
.button._primary { background: var(--x_color, #da3); border-color: var(--x_color, #da3); color: var(--x_dark_1, #000); }
.button._secondary:hover, button:not(._primary):hover { background: var(--override-box); }
button:disabled { opacity: .55; }
.box._outer { border: 1px solid var(--override-border); border-radius: 8px; background: var(--override-section); }
.box._inner { border: 1px solid var(--override-border); border-radius: 8px; background: var(--override-section); }
main, section, article, .grid > *, .flex > * { min-width: 0; }
p, label, small { overflow-wrap: anywhere; }
nav[aria-label] { flex-wrap: wrap; }
.box._padding { padding: 18px; }
.grid._columns_2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
nav button.active { border-color: var(--x_color, #da3); background: color-mix(in srgb, var(--x_color, #da3) 12%, white); }
input:not([type=checkbox]):not([type=radio]):not([type=hidden]):not([type=color]), select, textarea { width: 100%; min-height: 36px; padding: 8px 10px; border: 1px solid var(--override-border); border-radius: 5px; background: var(--x_light_1, #fff); color: var(--override-text); }
input:disabled, textarea:disabled { background: var(--override-box); color: var(--override-muted); }
textarea { resize: vertical; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; border-bottom: 1px solid var(--override-border); text-align: left; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--x_color, #da3); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
@media (max-width: 760px) { .grid._columns_2 { grid-template-columns: minmax(0, 1fr); } }
