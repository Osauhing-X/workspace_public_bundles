:root{
  --x_brand: #da3;
  --x_color: var(--color_override, var(--x_brand));
  
  --x_body_background: #eee;
  --x_header_background: #222;
  --x_aside_background: #111;


  /* LIGHT */
  --x_light_1: #fff; /* section, h1-h3, b */
  --x_light_2: #ccc; /* div, p, i, li, td */
  --x_light_3: #999; /* span, small */

  /* DARK */
  --x_dark_1: #000; /* section, h1-h3, b */
  --x_dark_2: #333; /* div, p, i, li, td */
  --x_dark_3: #777; /* span, small */
}


/* --- */


html {
  background-color: var(--x_body_background);
  scrollbar-color: #000 transparent;
  scrollbar-width: none;
  scroll-behavior: smooth; }


body {
  position: relative;
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;}



center.css {
  width: min(100% - var(--center_space_override, 2em), var(--center_max_override, 1000px));
  box-sizing: border-box;
  margin-inline: auto; 
  &._800{
    --center_max_override: 800px; }
  &._full {
    --center_space_override: 0; }
  &._left {
    text-align: left !important;} }
  


:is(section, aside).css {
  &._radius {
    border-radius: 5px;}
  &._padding {
    padding: 1em; }
  &._padding_2 {
    padding: 2em 10px;} }


:is(div, ul).css {
  &._radius {
    border-radius: 5px;}
  &._padding {
    padding: 10px; } }


/* --- # Popover */

html:has(:popover-open){
  -webkit-tap-highlight-color: transparent;
  &:has([popover="auto"]){
    cursor: url("https://extaas.com/ui_resources/close.png") 2 2, pointer; }
  body {
    background-image: url("https://extaas.com/ui_resources/bg/noise.png") !important;
    background-size: unset !important;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
    touch-action: none;
    filter: grayscale(1) opacity(0.3) blur(1em);

    [popover]:popover-open {
      border: 0 solid;
      overflow: hidden auto;
      scrollbar-width: none;
      scrollbar-color: transparent transparent;
      max-height: 100dvh;

      pointer-events: all;
      box-sizing: border-box;
      background: transparent;
      padding: 0;
      position: fixed;

      width: min(calc(100% - 1em), var(--w, 500px)) }

.grid {
  display: grid;
  grid-auto-rows: min-content;

    justify-items: start; }

  &._x {
    justify-content: center; }

    align-content: center;

  &._reverse {flex-direction: row-reverse;}
  &._right { justify-content: flex-end; }
  &._down { flex-direction: column; }
  &._space {justify-content: space-between;}
  &._bottom {align-items: flex-end;} }

  &._3 {gap: 15px;}
  &._5 {gap: 25px;}

[id] { scroll-margin-top: 55px; }

.auto_hide { content-visibility: auto }

.full_width {width: -webkit-fill-available !important;}

.full_text { white-space: nowrap; }

.hide, [type=hidden] { display: none !important }

.dark { color-scheme: dark; }

.light {  color-scheme: light;}

.reset { all: unset; }

@media (max-width: 800px){ .computer { display: none;} }

  &._x {
    width: -webkit-fill-available; }

.blur, [blur] {
